<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#242321">
  <title>雄韬湘菜土菜馆 · 全景设计预览</title>
  <script>
    (function(){var id=new URLSearchParams(location.search).get('node')||'CP16';if(!["CP16","CP01","CP14","CP09","CP15","CP08","CP07","CP13","CP06","CP03","CP12","CP10","TV_CENTRAL_VIEW","TV_SOUTH_VIEW","CP11","TEA_B","R01D","R01A","R01B","R02D","R02A","R02B","R03D","R03A","R03B","R04D","R04A","R04B","R05D","R05A","R05B","R06D","R06A","R06B","R07D","R07A","R07B","R08D","R08A","R08B","R09D","R09A","R09B","R10D","R10A","R10B","R11D","R11A","R11B","COR_EAST_A","COR_EAST_B","EL_EAST","EL_WEST","EL_SERVICE","WC_WASH","WC_ACCESS","WC_MEN","WC_WOMEN"].includes(id))id='CP16';var p=document.createElement('link');p.rel='preload';p.as='image';p.href='../images-v5/preview/'+id+'.webp?v=20261101v5';p.setAttribute('fetchpriority','high');document.head.appendChild(p)})();
  </script>
  <link rel="stylesheet" href="../styles.css?v=20261101v5">
  <link rel="stylesheet" href="../plan-ui.css?v=20261101v5">
</head>
<body>
  <main id="tour" aria-label="58个点位照片全景设计预览">
    <canvas id="panorama" tabindex="0" aria-label="拖动环顾全景，滚轮或双指缩放"></canvas>
    <img id="fallbackImage" alt="当前全景原图" hidden>
    <div id="hotspots" aria-label="全景位置"></div>
  </main>
  <header class="heading">
    <div><h1 id="tourTitle">雄韬 · 湘菜土菜馆全景</h1><p id="positionName">正在准备全景</p></div>
    <div class="header-actions">
      <button id="quality" class="text-button" type="button" aria-pressed="true">画质：高清</button>
      <button id="planToggle" class="text-button" type="button" aria-expanded="true" aria-controls="planPanel">全屏图纸</button>
      <button id="fullscreen" class="icon-button" type="button" aria-label="全屏查看" title="全屏查看"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
    </div>
  </header>
  <nav id="positionBar" class="position-bar" aria-label="切换全景区域" hidden>
    <button id="previous" type="button" aria-label="上一区域"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
    <label class="position-select"><span class="sr-only">切换区域</span><select id="positions" aria-label="切换区域"></select></label>
    <span id="positionCount"></span>
    <button id="next" class="next-button" type="button" aria-label="下一区域"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
  </nav>
  <aside class="image-tools"><a href="../lightboxes.html" style="margin-right:14px">三个灯箱效果</a><a href="../guide.html" style="margin-right:14px">使用说明</a><a id="download" href="#" download aria-disabled="true">下载此图</a></aside>
  <p id="help" class="help">拖动环顾 · 点箭头前往相邻位置 · 下方可选任意区域</p>
  <div id="status" class="status" role="status" aria-live="polite"><span id="statusText">正在读取第一张全景…</span><button id="retry" type="button" hidden>重试</button></div>
  <section id="planPanel" class="locator" aria-label="二层图纸与当前位置">
    <div class="locator-mobile-bar"><div><span>我在图纸哪里 · 二层</span><strong id="planMobileName">正在定位…</strong></div><button id="planMobileToggle" type="button" aria-expanded="false" aria-controls="planMap">展开图纸 ▴</button></div>
    <div class="locator-top"><div><strong>我在图纸哪里</strong><small>10月24日二层设计图 · 58点位照片漫游</small></div><div class="locator-actions"><button id="planExpand" type="button" aria-pressed="false">全屏图纸</button><button id="planClose" type="button" aria-label="返回全景" hidden>×</button></div></div>
    <div class="locator-current-box"><p id="planCurrent" class="locator-current" aria-live="polite">正在定位…</p><p id="planPointId" class="locator-point"></p><p id="planMode" class="locator-mode">局部跟随 · 换位置自动定位</p></div>
    <div class="locator-map"><svg id="planMap" role="group" aria-label="原二层图纸，红点为当前位置，扇形为观看方向"></svg></div>
    <div class="locator-bottom"><div class="locator-zoom"><button id="planPlus" type="button" aria-label="放大图纸比例">＋</button><button id="planMinus" type="button" aria-label="缩小图纸比例">−</button><button id="planReset" type="button">查看全图</button><button id="planLocate" type="button" aria-pressed="true">跟随我</button><button id="planAll" type="button" aria-pressed="false">全部点位</button></div><span class="locator-hint"><i aria-hidden="true"></i>红点是我 · 扇形是眼前方向 · 全部点位可切换区域<br>拖动查看图纸，点“跟随我”回到当前局部</span><p class="locator-note">图纸红点对应照片拍摄位置；净高暂按3.3米，可调整。材质、海报和商品为设计建议。</p></div>
  </section>
  <script src="manifest.js?v=20261101v5"></script>
  <script src="../plan-data.js?v=20261101v5"></script>
  <script>['image','background','plainImage'].forEach(function(k){if(window.PHOTO_TOUR_PLAN[k])window.PHOTO_TOUR_PLAN[k]='../'+window.PHOTO_TOUR_PLAN[k]})</script>
  <script src="../plan-ui.js?v=20261101v5"></script>
  <script src="../viewer.js?v=20261101v5"></script>
  <script>document.getElementById('tourTitle').textContent='雄韬 · 湘菜土菜馆全景';</script>
</body>
</html>
